# SFT on Qwen2.5-0.5B (guide recipe; H100 micro-batching: 16 x 2 = effective 32, same as guide 2 x 16)
model_name: Qwen/Qwen2.5-0.5B
train_path: outputs/data/sft_train.jsonl
val_path: outputs/data/sft_val.jsonl
output_dir: outputs/sft
max_length: 512
max_train_examples: 30000
max_val_examples: 1000
per_device_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 2.0e-5
warmup_ratio: 0.03
lr_schedule: cosine
weight_decay: 0.1
max_grad_norm: 1.0
num_epochs: 1
precision: auto      # bf16 autocast on H100 (fp16 + GradScaler on T4), fp32 master weights
eval_every: 100
log_every: 10
seed: 42
